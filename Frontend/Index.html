<!DOCTYPE html>
<html lang="en" ng-app="myApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practical - HTML 4.0</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- AngularJS Routing CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.js"></script>

    <!-- Your app.js file -->
    <script src="app.js?v=2"></script>
    <!-- Page-specific scripts (for routes like /calc and /studentform) -->
    <script src="./js/cal.js"></script>
    <script src="./js/studentform.js"></script>
    <script src="./js/register.js"></script>

    <link rel="stylesheet" href="./css/style.css?v=2" />
    <link rel="stylesheet" href="./css/profile.css?v=2" />
    <link rel="stylesheet" href="./css/login.css?v=3" />
    <link rel="stylesheet" href="./css/register.css?v=3" />
    <link rel="stylesheet" href="./css/studentform.css?v=3" />
  </head>

    <body ng-controller="headerCtrl">
    <table class="main-table">
      <!-- Header Section -->
      <tr class="header">
        <td colspan="3">
          <div class="header-container">
            <div class="header-left">
              <!-- AUTO LOGIN IMAGES -->
              <img
                src="./Asset/Dhruvil.jpg"
                class="student-img"
                ng-click="autoLogin('Dhruvil')"
                title="Auto login as Dhruvil"
              />
              <img
                src="./Asset/Dhrumil.jpg"
                class="student-img"
                ng-click="autoLogin('Dhrumil')"
                title="Auto login as Dhrumil"
              />
              <img
                src="./Asset/Chirag.jpg"
                class="student-img"
                ng-click="autoLogin('Chirag')"
                title="Auto login as Chirag"
              />
            </div>

            <div class="header-content">
              <h1>Welcome to Group 8 Webpage</h1>
              <h3>Student ID: 25GMCA36, 25GMCA34, 25GMCA50</h3>

              <!-- DYNAMIC HEADER TEXT -->
              <p class="header-status" ng-if="isLoggedIn">
                Logged in as
                <span>{{ currentUserName || 'Student' }}</span>
              </p>
              <p class="header-status" ng-if="!isLoggedIn">
                Not logged in
              </p>
            </div>

            <div class="header-right">
              <img src="./Asset/GMCA.png" class="logo" />
            </div>
          </div>
        </td>
      </tr>

      <!-- Navigation Bar -->
      <!-- NOTE: controller is now on <body>, so remove here -->
      <tr class="navbar">
        <td colspan="3">
          <a href="#!/home">Home</a> | <a href="#!/about">About Us</a> |
          <a href="#!/services">Services</a> |
          <a href="#!/contact">Contact</a> | 

          <!-- When NOT logged in -->
          <span ng-if="!isLoggedIn">
            <a href="#!/register">Register</a> |
            <a href="#!/login">Login</a>
          </span>

          <!-- When LOGGED IN -->
          <span ng-if="isLoggedIn">
            <a href="#!/profile">Profile</a> |
            <a href="#!/calc">Calculator</a> |
            <a href="#!/studentform">Student Form</a> |
            <a href="" ng-click="logout()">Logout</a>
          </span>
        </td>
      </tr>

      <!-- ROUTING CONTENT AREA -->
      <tr class="content-row">
        <td colspan="3">
          <div class="view-container">
            <div ng-view></div>
          </div>
        </td>
      </tr>

      <!-- Footer -->
      <tr class="footer">
        <td colspan="3">
          © 2025 Government MCA College, Maninagar. All Rights Reserved.
        </td>
      </tr>
    </table>
  </body>
</html>
