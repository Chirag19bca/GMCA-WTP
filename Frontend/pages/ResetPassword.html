<div class="auth-wrapper" ng-controller="resetPasswordCtrl">
  <div class="auth-card">
    <h2>Reset Password</h2>

    <form id="reset-form" ng-submit="resetPassword()" novalidate>
      <!-- NEW PASSWORD -->
      <div class="form-row password-row">
        <label>New Password</label>
        <div class="password-wrapper">
          <input
            ng-attr-type="{{ showPassword ? 'text' : 'password' }}"
            id="password"
            autocomplete="new-password"
            class="form-control"
            ng-model="data.password"
          />
          <span
            class="toggle-password"
            ng-click="showPassword = !showPassword"
            title="{{ showPassword ? 'Hide password' : 'Show password' }}"
          >
            👁
          </span>
        </div>
        <span class="error-msg" id="password_error"></span>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="form-row password-row">
        <label>Confirm Password</label>
        <div class="password-wrapper">
          <input
            ng-attr-type="{{ showPassword ? 'text' : 'password' }}"
            id="confirm_password"
            class="form-control"
            ng-model="data.confirm"
          />
          <span
            class="toggle-password"
            ng-click="showPassword = !showPassword"
            title="{{ showPassword ? 'Hide password' : 'Show password' }}"
          >
            👁
          </span>
        </div>
        <span class="error-msg" id="confirm_password_error"></span>
      </div>

      <div class="form-row">
        <button type="submit">Update Password</button>
      </div>
    </form>

    <p class="success-msg" ng-if="success">{{ success }}</p>
    <p class="error-msg" ng-if="error">{{ error }}</p>

    <div class="auth-links">
      <a href="#!/login">Back to Login</a>
    </div>
  </div>
</div>

<script src="../js/register.js"></script>
