<div class="auth-wrapper" ng-controller="registerCtrl">
  <div class="auth-card">
    <h2>Student Registration</h2>

    <!-- Angular handles submit -->
    <form id="register-form" ng-submit="doRegister()" novalidate>
      <div class="form-row">
        <label>Enrollment No</label>
        <input
          type="text"
          id="enrollment_no"
          name="enrollment_no"
          class="form-control"
          ng-model="register.enrollment_no"
        />
        <span class="error-msg" id="enrollment_no_error"></span>
      </div>

      <div class="form-row">
        <label>First Name</label>
        <input
          type="text"
          id="fname"
          name="fname"
          class="form-control"
          ng-model="register.fname"
        />
        <span class="error-msg" id="fname_error"></span>
      </div>

      <div class="form-row">
        <label>Last Name</label>
        <input
          type="text"
          id="lname"
          name="lname"
          class="form-control"
          ng-model="register.lname"
        />
        <span class="error-msg" id="lname_error"></span>
      </div>

      <div class="form-row">
        <label>Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          ng-model="register.email"
        />
        <span class="error-msg" id="email_error"></span>
      </div>

      <div class="form-row">
        <label>Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          ng-model="register.password"
        />
        <span class="error-msg" id="password_error"></span>
      </div>

      <div class="form-row">
        <button type="submit">Register</button>
      </div>
    </form>

    <p class="success-msg" ng-if="successMsg">{{ successMsg }}</p>
    <p class="error-msg" ng-if="errorMsg">{{ errorMsg }}</p>

    <div class="auth-links">
      <span>Already registered? </span>
      <a href="#!/login">Login here</a>
    </div>
  </div>
</div>

<!-- keep validation logic -->
<script src="../js/register.js"></script>
