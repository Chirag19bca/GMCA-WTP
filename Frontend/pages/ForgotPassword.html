<div class="auth-wrapper" ng-controller="forgotPasswordCtrl">
  <div class="auth-card">
    <h2>Forgot Password</h2>

    <form id="forgot-form" ng-submit="sendReset()" novalidate>

      <!-- Enrollment No -->
      <div class="form-row">
        <label>Enrollment No</label>
        <input
          type="text"
          id="enrollment_no"
          class="form-control"
          ng-model="data.enrollment_no"
        />
        <span class="error-msg" id="enrollment_no_error"></span>
      </div>

      <!-- Email -->
      <div class="form-row">
        <label>Email</label>
        <input
          type="email"
          id="email"
          class="form-control"
          ng-model="data.email"
        />
        <span class="error-msg" id="email_error"></span>
      </div>

      <div class="form-row">
        <button type="submit">Verify</button>
      </div>
    </form>

    <p class="error-msg" ng-if="error">{{ error }}</p>
    <p class="success-msg" ng-if="success">{{ success }}</p>

    <div class="auth-links">
      <a href="#!/login">Back to Login</a>
    </div>
  </div>
</div>

<!-- 🔁 Reuse SAME validation -->
<script src="../js/register.js"></script>
