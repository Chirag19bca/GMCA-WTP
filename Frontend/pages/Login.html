<div class="auth-wrapper" ng-controller="loginCtrl">
  <div class="auth-card">
    <h2>Login</h2>

    <form id="login-form" ng-submit="doLogin()">
      <div class="form-row">
        <label>Enrollment No</label>
        <input
          type="text"
          name="enrollment_no"
          id="enrollment_no"
          ng-model="loginData.enrollment_no"
          class="form-control"
        />
        <span class="error-msg" id="enrollment_no_error"></span>
      </div>

      <div class="form-row">
        <label>Email</label>
        <input
          type="email"
          name="email"
          id="email"
          autocomplete="nope"
          ng-model="loginData.email"
          class="form-control"
        />
        <span class="error-msg" id="email_error"></span>
      </div>

      <div class="form-row password-row">
        <label>Password</label>
        <div class="password-wrapper">
          <input
            ng-attr-type="{{ showPassword ? 'text' : 'password' }}"
            name="password"
            id="password"
            autocomplete="new-password"
            ng-model="loginData.password"
            class="form-control"
          />
          <span
            class="toggle-password"
            ng-click="showPassword = !showPassword"
            title="{{ showPassword ? 'Hide password' : 'Show password' }}"
          >
            {{ showPassword ? '👁' : '👁' }}
          </span>
        </div>
        <span class="error-msg" id="password_error"></span>
      </div>

      <p
        ng-if="errorMsg"
        style="color: red; font-size: 15px; font-weight: 600; margin-top: 6px"
      >
        {{errorMsg}}
      </p>

      <div class="form-row">
        <button type="submit">Login</button>
      </div>
    </form>

    <div class="auth-links">
      <span>New user?</span>
      <a href="#!/register">Register here</a> |
      <a href="#!/forgot-password">Forgot Password?</a>
    </div>
  </div>
</div>
